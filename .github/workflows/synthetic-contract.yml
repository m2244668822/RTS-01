name: RTS-01 synthetic contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run synthetic contract tests
        run: python -m unittest discover -s tests -v
      - name: Run CLI contract smoke
        run: python -m src.rts01_contract --workdir .rts01-synthetic-run
